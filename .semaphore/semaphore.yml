version: v1.0
name: Fiber CI

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

auto_cancel:
  running:
    when: "branch != 'main'"

global_job_config:
  prologue:
    commands:
      - checkout

blocks:
  - name: Lint
    dependencies: []
    run:
      # Mirrors GHA paths-ignore: **/*.md
      when: "change_in('/', {exclude: ['/**/*.md'], default_branch: 'main'})"
    task:
      jobs:
        - name: golangci-lint
          commands:
            # TODO(gha-to-semaphore): original lint.yml called the reusable
            # workflow gofiber/.github/.github/workflows/go-lint-single.yml@main.
            # Verify the version/flags below match that workflow's behavior.
            - sem-version go 1.25
            - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
            - golangci-lint run ./...

  - name: Unit tests (Linux)
    dependencies: []
    run:
      when: "change_in('/', {exclude: ['/**/*.md'], default_branch: 'main'})"
    task:
      jobs:
        - name: Go ${{matrix.GO_VERSION}}
          matrix:
            - env_var: GO_VERSION
              values: ["1.25", "1.26"]
          commands:
            - sem-version go $GO_VERSION
            - go run gotest.tools/gotestsum@latest -f testname -- ./... -race -count=1 -shuffle=on

  - name: Unit tests (macOS)
    dependencies: []
    run:
      when: "change_in('/', {exclude: ['/**/*.md'], default_branch: 'main'})"
    task:
      agent:
        machine:
          type: a1-standard-4
          os_image: macos-xcode15
      jobs:
        - name: Go ${{matrix.GO_VERSION}}
          matrix:
            - env_var: GO_VERSION
              values: ["1.25", "1.26"]
          commands:
            - sem-version go $GO_VERSION
            - go run gotest.tools/gotestsum@latest -f testname -- ./... -race -count=1 -shuffle=on

  - name: Repeated tests (race, count=15)
    dependencies: []
    run:
      when: "change_in('/', {exclude: ['/**/*.md'], default_branch: 'main'})"
    task:
      jobs:
        - name: Repeated
          commands:
            - sem-version go 1.25
            - go run gotest.tools/gotestsum@latest -f testname -- ./... -race -count=15 -shuffle=on
