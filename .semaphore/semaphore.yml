version: v1.0
name: Fiber CI

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

auto_cancel:
  running:
    when: "branch != 'main'"

global_job_config:
  prologue:
    commands:
      - checkout

blocks:
  - name: Lint
    dependencies: []
    task:
      jobs:
        - name: golangci-lint
          commands:
            # Matches gofiber/.github go-lint-single.yml@main (golangci-lint v2.6.2)
            - sem-version go 1.25
            - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
            - golangci-lint run ./...

  - name: Unit tests
    dependencies: []
    task:
      jobs:
        - name: Go 1.25
          commands:
            - sem-version go 1.25
            - go run gotest.tools/gotestsum@latest -f testname -- ./... -race -count=1 -shuffle=on
        - name: Go 1.26
          commands:
            - sem-version go 1.26
            - go run gotest.tools/gotestsum@latest -f testname -- ./... -race -count=1 -shuffle=on

  - name: Repeated tests (race, count=15)
    dependencies: []
    task:
      jobs:
        - name: Repeated
          commands:
            - sem-version go 1.25
            - go run gotest.tools/gotestsum@latest -f testname -- ./... -race -count=15 -shuffle=on
